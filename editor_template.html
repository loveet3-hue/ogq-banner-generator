<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
__CSS__
body{margin:0;font-family:-apple-system,'Pretendard',sans-serif;background:#f6f6f8;color:#222}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid #e5e5ea}
.bar button,.bar select{font-size:13px;padding:6px 10px;border:1px solid #d0d0d6;border-radius:8px;background:#fff;cursor:pointer}
.bar button.primary{background:#FF7A59;color:#fff;border-color:#FF7A59;font-weight:700}
.bar button.on{background:#FFE7DF;border-color:#FF7A59;color:#c2431f;font-weight:700}
.bar .sep{width:1px;height:22px;background:#e0e0e6;margin:0 4px}
.bar .grp{display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:10px;background:#f3f3f6}
#wrap{padding:10px;overflow:auto}
#c{box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff}
.pack{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#fff;border-top:1px solid #e5e5ea}
.pack img{height:56px;border:1px solid #e5e5ea;border-radius:8px;cursor:pointer;background:#fafafa}
.pack img:hover{border-color:#FF7A59}
.hint{font-size:12px;color:#777;padding:4px 10px 8px}
label{font-size:12px;color:#555}
#cropbar{display:none}
</style></head><body>
<div class="bar">
  <div class="grp"><button onclick="addText()">＋ 텍스트</button>
  <select id="font"><option value="Jua">주아(둥근)</option><option value="Gaegu">개구(손글씨)</option><option value="Pretendard">프리텐다드(고딕)</option></select>
  <label>글자색 <input type="color" id="fill" value="#1e1e22"></label>
  <label>테두리색 <input type="color" id="strokeColor" value="#ffffff"></label>
  <label>테두리 <input type="range" id="strokeW" min="0" max="30" value="8" style="width:60px"></label></div>
  <div class="grp"><button id="cropBtn" onclick="startCrop()">✂ 자르기</button>
  <button id="eraseBtn" onclick="toggleErase()">◌ 지우개</button>
  <label>지우개 크기 <input type="range" id="eraseW" min="5" max="120" value="30" style="width:60px"></label></div>
  <div class="grp"><label>배경색 <input type="color" id="bgcol" value="#ffffff" oninput="setBg(this.value)"></label></div>
  <button onclick="bringFront()">맨 앞으로</button>
  <button onclick="sendBack()">맨 뒤로</button>
  <button onclick="dup()">복제</button>
  <button onclick="del()">삭제</button>
  <button onclick="flipX()">좌우반전</button>
  <span class="sep"></span>
  <button onclick="undo()">↶ 실행취소</button>
  <button onclick="resetAll()">처음으로</button>
  <button class="primary" onclick="download()">⬇ PNG 다운로드</button>
</div>
<div class="bar" id="cropbar">
  <b>✂ 자르기:</b> <span>주황 사각형을 움직이거나 모서리를 끌어 남길 영역을 정한 뒤</span>
  <button class="primary" onclick="applyCrop()">자르기 적용</button>
  <button onclick="cancelCrop()">취소</button>
</div>
<div class="hint" id="hint">스티커/글자를 드래그해서 옮기고, 모서리를 끌어 크기·회전을 바꾸세요. 글자는 더블클릭하면 내용을 고칠 수 있어요. 스티커를 선택한 뒤 ✂ 자르기(영역만 남김) 또는 ◌ 지우개(문질러 지움)로 일부를 제거할 수 있습니다. 아래 목록에서 스티커를 추가할 수 있어요.</div>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="pack" id="pack"></div>
<script>
const D = __DATA__;
const maxW = Math.min(window.innerWidth - 24, 1000);
const zoom = Math.min(1, maxW / D.w);
const canvas = new fabric.Canvas('c', {preserveObjectStacking:true, selection:true});
canvas.setWidth(D.w*zoom); canvas.setHeight(D.h*zoom); canvas.setZoom(zoom);
const H = {cornerStyle:'circle', transparentCorners:false, cornerColor:'#FF7A59', borderColor:'#FF7A59'};
let history=[]; let histLock=false;
function snap(){ if(histLock) return; history.push(JSON.stringify(canvas.toJSON(['erasable']))); if(history.length>30) history.shift(); }
function undo(){ if(history.length<2) return; history.pop(); const st=history[history.length-1]; histLock=true;
  canvas.loadFromJSON(st, ()=>{ canvas.getObjects().forEach(o=>o.set(H)); if(canvas.backgroundImage) canvas.backgroundImage.erasable=false; canvas.renderAll(); histLock=false; }); }
canvas.on('object:modified',snap); canvas.on('object:added',()=>{ if(!loading) snap(); }); canvas.on('object:removed',()=>{ if(!loading) snap(); });
let loading=false;
function load(){
  loading=true; canvas.clear(); history=[];
  fabric.Image.fromURL(D.bg, img=>{ img.set({selectable:false, evented:false, left:0, top:0, erasable:false}); canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas)); });
  let pending = D.stickers.length;
  D.stickers.forEach(s=>fabric.Image.fromURL(s.src, img=>{ img.set(Object.assign({left:s.x, top:s.y}, H)); canvas.add(img); canvas.renderAll(); if(--pending===0){ loading=false; snap(); } }));
  D.texts.forEach(t=>{ const o=new fabric.IText(t.text,Object.assign({fontFamily:t.font,fontSize:t.size,fill:'#1e1e22',stroke:'#ffffff',strokeWidth:t.stroke,paintFirst:'stroke',strokeLineJoin:'round',
      originX:'center', originY: t.anchor==='middle'?'center':'top', left:t.x, top:t.y},H)); canvas.add(o); });
  if(pending===0){ loading=false; snap(); }
  canvas.renderAll();
}
Promise.all(['Jua','Gaegu','Pretendard'].map(f=>document.fonts.load('20px '+f).catch(()=>null))).then(load); setTimeout(()=>canvas.renderAll(),1500);
function active(){return canvas.getActiveObject();}
function addText(){
  const txt=prompt('넣을 문구를 입력하세요','NEW 출시!'); if(!txt)return;
  const o=new fabric.IText(txt,Object.assign({fontFamily:document.getElementById('font').value,fontSize:Math.round(D.h*0.1),fill:document.getElementById('fill').value,
    stroke:document.getElementById('strokeColor').value,strokeWidth:+document.getElementById('strokeW').value,paintFirst:'stroke',strokeLineJoin:'round',
    left:D.w/2,top:D.h/2,originX:'center',originY:'center'},H));
  canvas.add(o); canvas.setActiveObject(o); canvas.renderAll();
}
['font','fill','strokeColor','strokeW'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
  const o=active(); if(!o||o.type!=='i-text')return;
  o.set({fontFamily:document.getElementById('font').value,fill:document.getElementById('fill').value,stroke:document.getElementById('strokeColor').value,strokeWidth:+document.getElementById('strokeW').value});
  canvas.renderAll();
}));
canvas.on('selection:created',syncUI); canvas.on('selection:updated',syncUI);
function syncUI(){const o=active(); if(!o||o.type!=='i-text')return;
  document.getElementById('font').value=o.fontFamily; document.getElementById('fill').value=o.fill; document.getElementById('strokeColor').value=o.stroke||'#ffffff'; document.getElementById('strokeW').value=o.strokeWidth||0;}
function setBg(col){canvas.setBackgroundColor(col); canvas.setBackgroundImage(null); canvas.renderAll(); snap();}
function bringFront(){const o=active(); if(o){canvas.bringToFront(o);canvas.renderAll();snap();}}
function sendBack(){const o=active(); if(o){canvas.sendToBack(o);canvas.renderAll();snap();}}
function del(){const objs=canvas.getActiveObjects(); objs.forEach(o=>canvas.remove(o)); canvas.discardActiveObject(); canvas.renderAll();}
function dup(){const o=active(); if(!o)return; o.clone(c=>{c.set(Object.assign({left:o.left+30,top:o.top+30},H)); canvas.add(c); canvas.setActiveObject(c); canvas.renderAll();});}
function flipX(){const o=active(); if(o){o.set('flipX',!o.flipX); canvas.renderAll(); snap();}}
function resetAll(){ if(confirm('처음 상태로 되돌릴까요?')) load(); }
document.addEventListener('keydown',e=>{ if((e.key==='Delete'||e.key==='Backspace')&&active()&&!(active().isEditing)){del();e.preventDefault();} });
const packEl=document.getElementById('pack');
D.pack.forEach(src=>{const im=document.createElement('img'); im.src=src; im.onclick=()=>fabric.Image.fromURL(src,img=>{
  const sc=(D.h*0.5)/img.height; img.set(Object.assign({left:D.w/2-img.width*sc/2,top:D.h/2-img.height*sc/2,scaleX:sc,scaleY:sc},H));
  canvas.add(img); canvas.setActiveObject(img); canvas.renderAll();}); packEl.appendChild(im);});

/* ---------- 지우개 (선택한 스티커의 픽셀을 직접 지움) ---------- */
let erasing=false, eraseTarget=null, eraseDown=false;
function ensureCanvasElement(o){
  const el=o._element;
  if(el && el.tagName==='CANVAS') return el;
  const cv=document.createElement('canvas'); cv.width=o.width; cv.height=o.height;
  cv.getContext('2d').drawImage(el,0,0,o.width,o.height);
  o.setElement(cv); return cv;
}
function toggleErase(){
  const b=document.getElementById('eraseBtn');
  if(!erasing){
    const o=active();
    if(!o||o.type!=='image'){ alert('먼저 지울 스티커(이미지)를 클릭해서 선택하세요.'); return; }
    if(cropTarget) cancelCrop();
    erasing=true; eraseTarget=o; ensureCanvasElement(o);
    canvas.discardActiveObject(); canvas.skipTargetFind=true; canvas.selection=false; canvas.defaultCursor='crosshair'; canvas.hoverCursor='crosshair';
    b.classList.add('on'); b.textContent='◌ 지우개 끝';
    document.getElementById('hint').textContent='지우개 모드: 선택한 스티커 위를 드래그해서 지우세요. 끝나면 [지우개 끝]을 누르세요.';
  } else {
    erasing=false; eraseDown=false; canvas.skipTargetFind=false; canvas.selection=true; canvas.defaultCursor='default'; canvas.hoverCursor='move';
    if(eraseTarget){ eraseTarget.dirty=true; canvas.setActiveObject(eraseTarget); }
    eraseTarget=null; b.classList.remove('on'); b.textContent='◌ 지우개';
    document.getElementById('hint').textContent='스티커/글자를 드래그해서 옮기고, 모서리를 끌어 크기·회전을 바꾸세요.';
    canvas.renderAll(); snap();
  }
}
function eraseAt(ev){
  const o=eraseTarget; if(!o) return;
  const p=canvas.getPointer(ev.e);
  const inv=fabric.util.invertTransform(o.calcTransformMatrix());
  const lp=fabric.util.transformPoint(new fabric.Point(p.x,p.y), inv);
  let x=lp.x+o.width/2, y=lp.y+o.height/2;
  if(o.flipX) x=o.width-x; if(o.flipY) y=o.height-y;
  const r=(+document.getElementById('eraseW').value)/2/Math.max(o.scaleX,0.01);
  const ctx=o._element.getContext('2d');
  ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
  o.dirty=true; canvas.requestRenderAll();
}
canvas.on('mouse:down', ev=>{ if(erasing){ eraseDown=true; eraseAt(ev); } });
canvas.on('mouse:move', ev=>{ if(erasing&&eraseDown) eraseAt(ev); });
canvas.on('mouse:up', ()=>{ eraseDown=false; });

/* ---------- 자르기 ---------- */
let cropTarget=null, cropRect=null;
function startCrop(){
  const o=active();
  if(!o||o.type!=='image'){ alert('먼저 자를 스티커(이미지)를 클릭해서 선택하세요.'); return; }
  if(erasing) toggleErase();
  cropTarget=o;
  const b=o.getBoundingRect(true,true);
  cropRect=new fabric.Rect(Object.assign({left:b.left+b.width*0.1, top:b.top+b.height*0.1, width:b.width*0.8, height:b.height*0.8,
    fill:'rgba(255,122,89,0.18)', stroke:'#FF7A59', strokeWidth:2/zoom, strokeDashArray:[8,6], strokeUniform:true, lockRotation:true, hasRotatingPoint:false},H));
  cropRect.setControlsVisibility({mtr:false});
  o.set({selectable:false, evented:false});
  canvas.add(cropRect); canvas.setActiveObject(cropRect); canvas.renderAll();
  document.getElementById('cropbar').style.display='flex'; document.getElementById('cropBtn').classList.add('on');
}
function cancelCrop(){
  if(cropRect){ canvas.remove(cropRect); cropRect=null; }
  if(cropTarget){ cropTarget.set({selectable:true, evented:true}); canvas.setActiveObject(cropTarget); cropTarget=null; }
  document.getElementById('cropbar').style.display='none'; document.getElementById('cropBtn').classList.remove('on'); canvas.renderAll();
}
function applyCrop(){
  if(!cropTarget||!cropRect) return;
  const o=cropTarget, r=cropRect;
  // 크롭 사각형의 네 모서리를 이미지 로컬 좌표(중심 기준, 스케일 전)로 변환
  const inv=fabric.util.invertTransform(o.calcTransformMatrix());
  const pts=r.getCoords(true,true).map(p=>fabric.util.transformPoint(p,inv));
  let x0=Math.min(...pts.map(p=>p.x)), x1=Math.max(...pts.map(p=>p.x)), y0=Math.min(...pts.map(p=>p.y)), y1=Math.max(...pts.map(p=>p.y));
  // 로컬(중심 기준) → 이미지 픽셀
  const W=o.width, Hh=o.height;
  let px0=Math.max(0,Math.round(x0+W/2)), px1=Math.min(W,Math.round(x1+W/2)), py0=Math.max(0,Math.round(y0+Hh/2)), py1=Math.min(Hh,Math.round(y1+Hh/2));
  if(o.flipX){ const a=W-px1, b=W-px0; px0=a; px1=b; }
  if(o.flipY){ const a=Hh-py1, b=Hh-py0; py0=a; py1=b; }
  if(px1-px0<4||py1-py0<4){ alert('영역이 너무 작습니다.'); return; }
  // 오프스크린 캔버스에 원본(지우개 적용 포함) 렌더 후 크롭
  const src=document.createElement('canvas'); src.width=W; src.height=Hh;
  const sctx=src.getContext('2d');
  sctx.drawImage(o._element,0,0,W,Hh);
  const out=document.createElement('canvas'); out.width=px1-px0; out.height=py1-py0;
  out.getContext('2d').drawImage(src,px0,py0,out.width,out.height,0,0,out.width,out.height);
  const cx=(x0+x1)/2, cy=(y0+y1)/2; // 새 이미지 중심의 로컬 좌표
  const center=fabric.util.transformPoint(new fabric.Point(cx,cy), o.calcTransformMatrix());
  const newImg=new fabric.Image(out, Object.assign({originX:'center',originY:'center',left:center.x,top:center.y,scaleX:o.scaleX,scaleY:o.scaleY,angle:o.angle,flipX:o.flipX,flipY:o.flipY},H));
  const idx=canvas.getObjects().indexOf(o);
  canvas.remove(cropRect); canvas.remove(o);
  canvas.insertAt(newImg, idx, false); canvas.setActiveObject(newImg);
  cropRect=null; cropTarget=null;
  document.getElementById('cropbar').style.display='none'; document.getElementById('cropBtn').classList.remove('on');
  canvas.renderAll(); snap();
}

function download(){
  if(cropTarget) cancelCrop(); if(erasing) toggleErase();
  canvas.discardActiveObject(); canvas.renderAll();
  const url=canvas.toDataURL({format:'png', multiplier:1/zoom});
  const a=document.createElement('a'); a.href=url; a.download=D.name+'_edit.png'; document.body.appendChild(a); a.click(); a.remove();
}
</script></body></html>
